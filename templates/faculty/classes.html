{% extends "base.html" %}
{% block content %}
<h2><i class="bi bi-door-open"></i> My Classes</h2>
<div class="row">
{% for class in classes %}
<div class="col-md-6 mb-3">
    <div class="card">
        <div class="card-header bg-primary text-white">{{ class.course.course_code }}</div>
        <div class="card-body">
            <h5>{{ class.course.course_name }}</h5>
            <p><strong>Section:</strong> {{ class.section }}<br>
            <strong>Schedule:</strong> {{ class.schedule }}<br>
            <strong>Room:</strong> {{ class.room }}</p>
            <a href="{{ url_for('faculty_class_detail', class_id=class.id) }}" class="btn btn-primary">View Details</a>
        </div>
    </div>
</div>
{% endfor %}
</div>
{% endblock %}
